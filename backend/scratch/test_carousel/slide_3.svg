<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&amp;display=swap');
      
      .bg { fill: #0B0F19; }
      .card-bg { fill: #131B2E; rx: 32px; filter: url(#shadow); }
      .text-primary { font-family: 'Plus Jakarta Sans', Arial, sans-serif; fill: #FFFFFF; font-weight: 800; }
      .text-body { font-family: 'Plus Jakarta Sans', Arial, sans-serif; fill: #94A3B8; font-weight: 400; }
      .accent-gradient { fill: url(#brandGrad); }
      .accent-text { font-family: 'Plus Jakarta Sans', Arial, sans-serif; fill: url(#brandGrad); font-weight: 800; }
      
      .a {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation-fill-mode: forwards;
      }
      .fade-up {
        animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
      }
      .fade-up-delayed {
        animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards, floatIdle 4s ease-in-out 1.1s infinite alternate;
      }
      .pulse-btn {
        animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards, pulseScale 2.5s ease-in-out 1.5s infinite alternate;
      }
      
      @keyframes fadeUp {
        0% { opacity: 0; transform: translateY(30px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes floatIdle {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes pulseScale {
        0% { transform: scale(1); }
        100% { transform: scale(1.02); }
      }

      @media (prefers-reduced-motion: reduce) { 
        .a { animation: none !important; opacity: 1 !important; transform: none !important; } 
      }
    </style>
    
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" class="bg" />

  <!-- Ambient background glow (rhymes with slide 1) -->
  <circle cx="540" cy="450" r="300" fill="#4F46E5" opacity="0.15" filter="url(#glow)" />

  <!-- Persistent UI: Brand & Progress -->
  <text x="90" y="110" class="text-primary" font-size="28" text-anchor="start">IncuBrix</text>
  <text x="990" y="110" class="text-body" font-size="28" text-anchor="end">3 / 3</text>

  <!-- Main Card container -->
  <g class="a fade-up">
    <rect x="90" y="180" width="900" height="990" rx="40" fill="url(#cardGrad)" stroke="#334155" stroke-width="2" filter="url(#shadow)" />
  </g>

  <!-- Seamless Swipe Edge Element (Left Edge Connection to Slide 2) -->
  <path d="M 90,750 C 70,780 70,820 90,850" fill="none" stroke="url(#brandGrad)" stroke-width="6" stroke-linecap="round" />
  <circle cx="90" cy="800" r="6" fill="#4F46E5" />

  <!-- Hero Graphic: Rocket / Growth Launch Icon -->
  <g class="a fade-up-delayed">
    <circle cx="540" cy="450" r="110" fill="#1E293B" stroke="url(#brandGrad)" stroke-width="3" />
    <!-- Rocket Shape -->
    <path d="M 540,380 C 565,410 575,450 575,480 L 555,500 H 525 L 505,480 C 505,450 515,410 540,380 Z" fill="url(#brandGrad)" />
    <!-- Rocket Window -->
    <circle cx="540" cy="445" r="14" fill="#0B0F19" />
    <!-- Rocket Fin Left -->
    <path d="M 505,480 L 485,500 L 515,500 Z" fill="#4F46E5" />
    <!-- Rocket Fin Right -->
    <path d="M 575,480 L 595,500 L 565,500 Z" fill="#06B6D4" />
    <!-- Flame -->
    <path d="M 525,500 L 540,535 L 555,500 Z" fill="#F59E0B" />
  </g>

  <!-- Typography: Headline & Sub -->
  <g class="a fade-up" style="animation-delay: 0.7s;">
    <text x="540" y="640" class="text-primary" font-size="64" text-anchor="middle">Ready to Automate?</text>
    <text x="540" y="720" class="text-body" font-size="34" text-anchor="middle">Start your autonomous social journey today.</text>
  </g>

  <!-- Action Button -->
  <g class="a pulse-btn">
    <rect x="240" y="790" width="600" height="110" rx="55" fill="url(#brandGrad)" filter="url(#shadow)" />
    <text x="540" y="860" class="text-primary" font-size="36" text-anchor="middle">Start Free Trial</text>
  </g>

  <!-- Brand Footer Info -->
  <g class="a fade-up" style="animation-delay: 0.9s;">
    <text x="540" y="990" class="text-primary" font-size="30" text-anchor="middle">incubrix.com</text>
    <text x="540" y="1035" class="text-body" font-size="26" text-anchor="middle">@incubrix</text>
  </g>
</svg>